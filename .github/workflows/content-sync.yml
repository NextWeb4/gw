name: Refresh public source metadata

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:content
      - run: pnpm content:sync
      - run: pnpm content:verify
      - name: Detect source changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- content/generated; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.changed == 'true'
        run: pnpm lint
      - if: steps.changes.outputs.changed == 'true'
        run: pnpm test
      - if: steps.changes.outputs.changed == 'true'
        run: pnpm --filter @hxhwang/web build
        env: { VITE_BASE_PATH: /gw/ }
      - if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with: { path: apps/web/dist }
      - name: Commit changed source metadata
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/generated/source-snapshots.json content/generated/knowledge-pack.json
          git diff --cached --check
          git commit -m 'chore(content): refresh authority source metadata'
          git push origin HEAD:main

  deploy:
    if: needs.sync.outputs.changed == 'true'
    needs: sync
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
