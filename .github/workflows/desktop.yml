name: Build desktop packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm content:verify
      - run: pnpm assets:verify
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:internet
      - run: pnpm test:e2e:intranet

  windows:
    needs: verify
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        edition: [internet, intranet]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:desktop:win:${{ matrix.arch }}:${{ matrix.edition }}
      - uses: actions/upload-artifact@v4
        with:
          name: HxHwang-Gw-windows-${{ matrix.edition }}-${{ matrix.arch }}
          path: apps/desktop/release/*-setup.exe

  linux:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        edition: [internet, intranet]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:desktop:linux:${{ matrix.arch }}:${{ matrix.edition }}
      - uses: actions/upload-artifact@v4
        with:
          name: HxHwang-Gw-linux-${{ matrix.edition }}-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb

  debian-smoke:
    needs: linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { edition: internet, arch: x64, platform: linux/amd64, image: 'debian:10-slim' }
          - { edition: internet, arch: arm64, platform: linux/arm64, image: 'debian:10-slim' }
          - { edition: internet, arch: x64, platform: linux/amd64, image: 'debian:12-slim' }
          - { edition: internet, arch: arm64, platform: linux/arm64, image: 'debian:12-slim' }
          - { edition: intranet, arch: x64, platform: linux/amd64, image: 'debian:10-slim' }
          - { edition: intranet, arch: arm64, platform: linux/arm64, image: 'debian:10-slim' }
          - { edition: intranet, arch: x64, platform: linux/amd64, image: 'debian:12-slim' }
          - { edition: intranet, arch: arm64, platform: linux/arm64, image: 'debian:12-slim' }
    steps:
      - name: Enable arm64 emulation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: actions/download-artifact@v4
        with:
          name: HxHwang-Gw-linux-${{ matrix.edition }}-${{ matrix.arch }}
          path: packages
      - name: Install and launch on Debian
        shell: bash
        run: |
          docker run --rm --platform '${{ matrix.platform }}' \
            -v '${{ github.workspace }}/packages:/packages:ro' \
            '${{ matrix.image }}' sh -euxc '
              if grep -q "VERSION_ID=\"10\"" /etc/os-release; then
                sed -i "s|deb.debian.org/debian|archive.debian.org/debian|g; s|security.debian.org/debian-security|archive.debian.org/debian-security|g" /etc/apt/sources.list
                printf "Acquire::Check-Valid-Until \"false\";\n" >/etc/apt/apt.conf.d/99archive
              fi
              apt-get update
              apt-get install -y /packages/*.deb xvfb xauth passwd
              useradd -m smoke
              executable="$(find /opt -type f -name HxHwang-Gw -perm /111 | head -n 1)"
              test -n "$executable"
              set +e
              su -s /bin/sh smoke -c "timeout 20s xvfb-run -a \"$executable\" --disable-gpu --no-sandbox"
              exit_code=$?
              set -e
              test "$exit_code" -eq 124
            '

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, debian-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: HxHwang-Gw-*
          path: release
          merge-multiple: true
      - name: Verify release matrix and create checksums
        shell: bash
        run: |
          set -euo pipefail
          for edition in internet intranet; do
            compgen -G "release/*-${edition}-x64-setup.exe" >/dev/null
            compgen -G "release/*-${edition}-arm64-setup.exe" >/dev/null
            compgen -G "release/*-${edition}-x86_64.AppImage" >/dev/null
            compgen -G "release/*-${edition}-arm64.AppImage" >/dev/null
            compgen -G "release/*-${edition}-amd64.deb" >/dev/null
            compgen -G "release/*-${edition}-arm64.deb" >/dev/null
          done
          cd release
          sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --generate-notes --title "HxHwang Gw $GITHUB_REF_NAME"
          fi
